name: Secret scan

# Betterleaks で、PR / push で増えたコミットだけを秘密の検査にかける。
# ローカルの pre-push（.githooks/pre-push）は別ホストからの push や --no-verify で
# 素通りするため、その保険。規則は .betterleaks.toml（--config で渡さないと読まれない）。

on:
  push:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# Betterleaks 本体はトークンを使わない。checkout に要る読み取り権限だけにする。
permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    env:
      BL_VERSION: 2.0.0-rc.1
    steps:
      # v7.0.1。差分の範囲を git log で辿るため履歴を全部取る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 公式の Action はまだ無い（betterleaks/betterleaks#39）。非公式の Action に権限を
      # 渡さないよう、リリースのバイナリを直接取得し、checksums.txt と照合してから展開する。
      - name: Install Betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}"
          tarball="betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "$tarball" betterleaks
          ./betterleaks --version

      # 検査範囲は増えたコミットに絞る。
      # before が全 0（ブランチ作成）や履歴に無い（force push）ときは、他のブランチ
      # （origin/*。push されたブランチ自身を除く）に無いコミットだけを見る。
      # 他にブランチが無ければ after までの全履歴になる。
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "${PUSH_BEFORE//0/}" ] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            others=$(git for-each-ref --format='%(refname)' refs/remotes/origin \
              | grep -vxF -e "refs/remotes/origin/HEAD" -e "refs/remotes/origin/$REF_NAME" || true)
            range="$PUSH_AFTER"
            if [ -n "$others" ]; then
              range="$PUSH_AFTER --not $(echo $others)"
            fi
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "range: $range"
          ./betterleaks git . --log-opts="$range" --config .betterleaks.toml --redact --no-banner
