name: Secret scan

# Betterleaks で、全 ref の全履歴を毎回秘密の検査にかける。
# ローカルの pre-push（.githooks/pre-push）は別ホストからの push や --no-verify で
# 素通りするため、その保険。規則は .betterleaks.toml（--config で渡さないと読まれない）。

on:
  push:
  pull_request:

# Betterleaks 本体はトークンを使わない。checkout に要る読み取り権限だけにする。
permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    env:
      BL_VERSION: 2.0.0-rc.1
    steps:
      # v7.0.1。履歴を全部取る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 公式の Action はまだ無い（betterleaks/betterleaks#39）。非公式の Action に権限を
      # 渡さないよう、リリースのバイナリを直接取得し、checksums.txt と照合してから展開する。
      - name: Install Betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}"
          tarball="betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "$tarball" betterleaks
          ./betterleaks --version

      # 範囲を計算せず、毎回全 ref の全履歴を検査する（このリポジトリは全履歴で約 1 MB・0.1 秒）。
      # 範囲の計算は、連続 push で未検査のコミットが残る・並行 push で互いを除外する、といった漏れの元になる。
      # --diff-merges=separate: merge commit にだけ足された内容も検査する。
      # --no-renames: 内容を変えない改名（.env.remote.example -> .env.local）も追加として検査する。
      - name: Scan
        run: ./betterleaks git . --log-opts="--all --diff-merges=separate --no-renames" --config .betterleaks.toml --redact --no-banner
