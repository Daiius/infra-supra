name: Stats image

# 集計のサーバー（packages/stats）のイメージを作り、GHCR に push する（prd/15 §7.1・§7.2）。
# main への push（下の paths に当たるとき）と、手で起動したとき（Actions の画面で ref を選ぶ）に走る（D-228）。
# タグはコミットの SHA（画面と同じコミットにそろえる確かめに使う。D-135）。latest は下の判定の step が付けると決めたときだけ付ける。
# ⚠ 本番の VPS の側で latest の追従を有効にすると、VPS が latest を数分おきに見て、変わっていれば自動で入れ替える。
#   そのあとは **main に入った集計のサーバーの変更は、このビルドを経て数分で本番に出る**（AGENTS.md「main に入ると本番に出る」・prd/15 §7.2）。
# 画面（packages/web）は Vercel の側でビルドされるので対象外。
# 第三者の action は使わず、ランナーの docker で作る。

on:
  push:
    branches: [main]
    # packages/stats/Dockerfile.prod が読むものだけ（漏れると集計のサーバーに効く変更がビルドされず、
    # 広すぎると関係ない変更で本番が再起動する）。
    #   - 根の package.json / pnpm-lock.yaml / pnpm-workspace.yaml / tsconfig.json: 先頭の COPY
    #     （stats・game・catalog・estimator の tsconfig.json は根の tsconfig.json を extends する）
    #   - packages/{stats,game,catalog,estimator}/package.json: 依存の定義の COPY
    #   - packages/{game,catalog,estimator}/: ディレクトリごとの COPY。バンドルに入るのは src/ と、esbuild が読む tsconfig.json
    #   - packages/stats/: ディレクトリごとの COPY。ビルドが読むのは src/・migrate.ts・esbuild.config.ts・tsconfig.json、
    #     最終ステージが読むのは drizzle/（migrator が実行のときに読む SQL）
    #   - Dockerfile.prod 自身と、この workflow 自身（ビルドの手順・タグ・ビルド引数）
    # 入れていないもの（COPY はされるが、サーバーの実行物を変えない）:
    #   packages/web/package.json（--frozen-lockfile のためだけ。依存を変えれば pnpm-lock.yaml が変わる）、
    #   packages/stats/{deploy,scripts}/・.env.example・drizzle.config.ts・各パッケージの vitest.config.ts、.dockerignore。
    #   src/ の中のテスト（*.test.ts）は分けられないので、テストだけの変更でもビルドされる。
    # ⚠ 下の印の間は「latest を付けるか」の step もこのファイルから読む（一覧はここ 1 か所だけ）。
    #   形は「- <パス>」を 1 行ずつ。印を消したり、ほかの形の行を挟むと、その step は latest を付けずに止まる。
    paths:
      # >>> server-paths
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - packages/stats/package.json
      - packages/stats/tsconfig.json
      - packages/stats/esbuild.config.ts
      - packages/stats/migrate.ts
      - packages/stats/src/**
      - packages/stats/drizzle/**
      - packages/stats/Dockerfile.prod
      - packages/game/package.json
      - packages/game/tsconfig.json
      - packages/game/src/**
      - packages/catalog/package.json
      - packages/catalog/tsconfig.json
      - packages/catalog/src/**
      - packages/estimator/package.json
      - packages/estimator/tsconfig.json
      - packages/estimator/src/**
      - .github/workflows/stats-image.yml
      # <<< server-paths
  workflow_dispatch:

# 同じ ref のビルドは直列にする（古いコミットのビルドが、あとから latest を上書きしないように）。
# 待っている回は、より新しい回が来れば GitHub が取り消す（走るのは「今の 1 つ」と「最新の 1 つ」だけ）。
# 走っている回は打ち切らない（cancel-in-progress: false）: push の途中で止めると、SHA のタグだけが
# できて latest が付かない、などの半端な状態が残りうる。待っても 1 回分のビルドで済む。
concurrency:
  group: stats-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/daiius/infra-supra-stats

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1（test.yml と同じ固定）。「latest を付けるか」の判定に main の履歴が要る（祖先の判定と差分）ので、浅い取得にしない。
      # 資格情報は残さない（公開のリポジトリなので、判定の step の git fetch は資格情報なしで通る）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # latest（本番が追いかけるタグ）を付けるのは、次の全部を満たすときだけ:
      #   1. 既定の枝（main）の回である（手で起動してほかの枝を選んだ回には付けない）
      #   2. このコミットが、いまのリモートの main の先頭か、その祖先である（main に無いコミットには付けない）
      #   3. このコミットから main の先頭までの間に、上の paths（ビルド対象）に効く変更が無い
      #      ＝このイメージは main の最新と同じ中身。効く変更があれば、そのコミットで別の回が走って付ける。
      #      （先頭だけを見ると、サーバーの変更 A のあとに文書だけの B が入ったとき、A に付かず、B ではビルドが
      #        起動しないので、A が本番に出ないまま残る。古い回の再実行は 3 で弾かれ、latest は戻らない）
      # 判定できないとき（履歴が浅い・main を取れない・paths の一覧を読めない）は、安全側で付けない。
      # 結果と理由は実行の Summary に 1 行出す。
      # paths の照合は git の pathspec（:(glob)）で行う。`*` は `/` を越えず、末尾の `/**` は配下すべてで、
      # 今の一覧の書き方では GitHub の paths フィルタと同じ範囲になる（`?`・`+`・`!`・`{}` などは使わないこと）。
      - name: Decide whether to move latest
        id: latest
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_FILE: .github/workflows/stats-image.yml
        run: |
          # Actions の bash は -e -o pipefail で動く。失敗を判定に使うコマンドは if / || で受ける。
          set -u
          decide() {
            echo "enable=$1" >> "$GITHUB_OUTPUT"
            if [ "$1" = true ]; then verb="latest を付ける"; else verb="latest を付けない"; fi
            echo "${verb}: $2（${GITHUB_SHA}）" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            decide false "既定の枝（$DEFAULT_BRANCH）の回ではない（$GITHUB_REF）"
          fi

          # paths の一覧を、このコミットの workflow の印の間から読む。
          if [ "$(grep -c '^ *# >>> server-paths$' "$WORKFLOW_FILE")" != 1 ] ||
             [ "$(grep -c '^ *# <<< server-paths$' "$WORKFLOW_FILE")" != 1 ]; then
            decide false "paths の一覧の印（server-paths）が見つからない"
          fi
          specs=()
          while IFS= read -r line; do
            t="${line#"${line%%[![:space:]]*}"}"
            case "$t" in
              ''|'#'*) ;;
              '- '*) specs+=(":(glob)${t#- }") ;;
              *) decide false "paths の一覧に読めない行がある: $t" ;;
            esac
          done < <(sed -n '/^ *# >>> server-paths$/,/^ *# <<< server-paths$/p' "$WORKFLOW_FILE")
          if [ "${#specs[@]}" -eq 0 ]; then
            decide false "paths の一覧が空"
          fi

          if ! git fetch --quiet --no-tags origin "refs/heads/$DEFAULT_BRANCH"; then
            decide false "リモートの $DEFAULT_BRANCH を取得できない"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            decide false "履歴が浅く、祖先と差分を判定できない"
          fi
          if ! head=$(git rev-parse --verify --quiet 'FETCH_HEAD^{commit}'); then
            decide false "リモートの $DEFAULT_BRANCH の先頭を読めない"
          fi

          if [ "$head" = "$GITHUB_SHA" ]; then
            decide true "$DEFAULT_BRANCH の先頭"
          fi
          rc=0
          git merge-base --is-ancestor "$GITHUB_SHA" "$head" || rc=$?
          case $rc in
            0) ;;
            1) decide false "$DEFAULT_BRANCH の先頭（$head）の祖先ではない" ;;
            *) decide false "$DEFAULT_BRANCH の先頭（$head）との祖先の判定に失敗した" ;;
          esac
          if ! changed=$(git diff --name-only "$GITHUB_SHA" "$head" -- "${specs[@]}"); then
            decide false "$DEFAULT_BRANCH の先頭（$head）との差分を取れない"
          fi
          if [ -n "$changed" ]; then
            n=$(printf '%s\n' "$changed" | wc -l)
            decide false "あとのコミットにビルド対象の変更がある（${n} 件。例: $(printf '%s\n' "$changed" | head -n 1)。その回が付ける）"
          fi
          decide true "$DEFAULT_BRANCH は先（$head）へ進んだが、間にビルド対象の変更が無い"

      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -f packages/stats/Dockerfile.prod \
            --build-arg GIT_COMMIT="$SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.source=https://github.com/Daiius/infra-supra \
            --label org.opencontainers.image.revision="$SHA" \
            -t "$IMAGE:$SHA" .
      # SHA のタグを先に push し、latest はそのあとで付け替える（latest が、まだ無い版を指す瞬間を作らない）。
      - name: Push
        env:
          SHA: ${{ github.sha }}
          LATEST: ${{ steps.latest.outputs.enable }}
        run: |
          docker push "$IMAGE:$SHA"
          echo "pushed $IMAGE:$SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LATEST" = true ]; then
            docker tag "$IMAGE:$SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
            echo "pushed $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
