name: Test

# 型検査・テスト・整形の確認を、全ブランチの push と PR で回す（D-87）。
# 秘密の検査は secret-scan.yml が別に持つ。
# 組み合わせの総当たり（game の combo-sweep.test.ts）は重いので、それだけを別の job に分けて並べて回す
# （部品は 2026-11-04 から pairwise に絞った。D-114 CP-14）。2 つの job を合わせると `pnpm test` と同じ範囲になる。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1（secret-scan.yml と同じ固定）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.1.0。版は package.json の packageManager から読む
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # combo-sweep.test.ts を除く全部（それは下の combo-sweep の job が回す）
      - run: pnpm test:fast
      - run: pnpm format:check

  combo-sweep:
    runs-on: ubuntu-latest
    steps:
      # 上の test の job と同じ固定
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:sweep
