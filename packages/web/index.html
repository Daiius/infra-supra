<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ヘッダーのロゴの字体（D-184。使う 8 文字だけに絞ったもの） -->
    <link
      rel="preload"
      href="/fonts/philosopher-bold-supra-inf.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>infra-supra（仮称）</title>
    <!-- OGP（D-191）。__OG_IMAGE_URL__ はビルドのとき vite.config.ts が VITE_SITE_URL + /og.png（無ければ /og.png）に置き換える。
         画像（public/og.png）は og.html を dev で開いて 1200×630 の箱を撮ったもの（手順は decisions.md の D-191） -->
    <meta
      name="description"
      content="実在するクラウドの料金で、Web アプリのインフラの月額と制限を比べながら運営するシミュレーションです。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="infra-supra" />
    <meta property="og:title" content="infra-supra" />
    <meta
      property="og:description"
      content="実在するクラウドの料金で、Web アプリのインフラの月額と制限を比べながら運営するシミュレーションです。"
    />
    <meta property="og:image" content="__OG_IMAGE_URL__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="infra-supra のロゴ（分子 Supra・分母 Infra の分数の形）"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="infra-supra" />
    <meta name="twitter:image" content="__OG_IMAGE_URL__" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
