# 集計のサーバーの前段の nginx の例（prd/15 §7.1）。写して <…> を埋める。実ホスト名はリポジトリに書かない。
# 🔒 アクセスログに IP・X-Forwarded-For を残さない（§4・プライバシーポリシー）。
#   access_log off; にするか、下の log_format のように $remote_addr・$http_x_forwarded_for を含めない。
#   error_log にもクライアントの IP が出るので、レベルを crit に上げる（上げないなら、ログの保存先と期間を別に決める）。

log_format stats_noip '[$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 443 ssl;
    http2 on;
    server_name <API のホスト名>;

    ssl_certificate     <証明書の fullchain のパス>;
    ssl_certificate_key <証明書の鍵のパス>;

    access_log /var/log/nginx/infra-supra-stats.log stats_noip;
    error_log  /var/log/nginx/infra-supra-stats.error.log crit;

    # 送信の本文の上限はサーバーが 64 KB（D-149）。nginx 側も少し余裕を持たせて止める
    client_max_body_size 128k;

    # /api/* だけを通す（ほかは 404）
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        # サーバーは IP を使わないので、X-Forwarded-For・X-Real-IP は渡さない
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
